version: '3.8'

services:
  db:
    image: postgres:16
    container_name: sensai-postgres
    environment:
      POSTGRES_DB: mealplanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend/senseai
      dockerfile: Dockerfile
    container_name: sensai-backend
    ports:
      - "8080:8080"
    environment:
      DB_USER: postgres
      DB_PASS: postgres
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    # Optional: resource limits
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sensai-frontend
    ports:
      - "5173:80"   # nginx serves on port 80, mapped to 5173
    depends_on:
      - backend

volumes:
  postgres_data: